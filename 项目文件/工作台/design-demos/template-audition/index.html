<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>固定模板 · 试听 Demo</title>
  <style>
    :root{color-scheme:dark;--ink:#eeece8;--muted:#a4a5aa;--line:#ffffff20;--accent:#d7d3e7}
    *{box-sizing:border-box}
    body{margin:0;background:#111215;color:var(--ink);font-family:"Microsoft YaHei",sans-serif}
    main{max-width:1560px;margin:auto;padding:22px 30px 28px}
    header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:16px}
    h1{font-size:20px;font-weight:500;margin:0;letter-spacing:.5px}
    header p{font-size:13px;color:var(--muted);margin:0}
    .screen{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#090c10;border:1px solid var(--line)}
    iframe{display:block;width:1920px;height:1080px;transform-origin:top left;border:0}
    .screen:fullscreen{width:100vw;height:100vh;aspect-ratio:auto;border:0;display:grid;place-items:center;background:#000}
    .screen:fullscreen iframe{position:absolute}
    .loading{position:absolute;inset:0;display:grid;place-items:center;background:#13171c;color:var(--muted);padding:24px;text-align:center;font-size:14px}
    [hidden]{display:none!important}
    .toolbar{display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}
    button,select{font:inherit;font-size:13px;color:var(--ink);background:#1b1c22;border:1px solid var(--line);border-radius:6px;min-height:42px;padding:9px 16px;cursor:pointer}
    button:hover,select:hover{background:#2c2d35;border-color:#787580}
    button[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
    button:disabled,input:disabled{opacity:.4;cursor:wait}
    button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
    #play{min-width:105px;background:var(--accent);color:#1a1822;border-color:var(--accent);font-weight:600}
    #seek{flex:1;min-width:120px;accent-color:var(--accent)}
    #clock{font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);min-width:83px}
    .choices{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .choices label{color:var(--muted);font-size:13px;margin-right:2px}
    .below{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-top:16px;flex-wrap:wrap}
    .note{margin:14px 0 0;color:var(--muted);font-size:14px;line-height:1.8}
    .loop{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px}
    .loop input{accent-color:var(--accent)}
    @media(max-width:700px){main{padding:16px 12px}header{align-items:flex-start;flex-direction:column;gap:6px}h1{font-size:18px}.toolbar{gap:8px}button,select{padding:9px 12px}.below{align-items:flex-start}#seek{min-width:100px}}
  </style>
<link rel="stylesheet" href="/project/ui-shell.css">
</head>
<body>
<main>
  <header><h1>固定模板 · 试听 Demo</h1><p>保留左侧卡组，让歌词成为另一处清晰的焦点</p></header>
  <div class="screen" id="screen">
    <iframe src="../../index.html?presentation=template&amp;lyricFx=contour" title="音乐模板试听画面" allow="autoplay; fullscreen"></iframe>
    <div class="loading" role="status">正在载入音乐与高清动态素材…</div>
  </div>
  <div class="toolbar">
    <button id="play" disabled>播放试听</button>
    <button id="restart" disabled aria-label="从选段开头播放">重播</button>
    <input id="seek" type="range" min="38.97" max="53.67" step="0.0166667" value="39.6" disabled aria-label="试听进度">
    <output id="clock" for="seek">00:39 / 00:53</output>
    <button id="fullscreen">全屏</button>
  </div>
  <div class="below">
    <div class="choices" aria-label="选择试听片段">
      <label>片段</label>
      <button class="segment" data-segment="verse" aria-pressed="false" disabled>主歌</button>
      <button class="segment" data-segment="chorus" aria-pressed="true" disabled>副歌与切卡</button>
      <button class="segment" data-segment="next" aria-pressed="false" disabled>换一组背景</button>
    </div>
    <div class="choices" aria-label="比较模板">
      <button class="variant" data-mode="demo" aria-pressed="true" disabled>本次 Demo</button>
      <button class="variant" data-mode="original" aria-pressed="false" disabled>当前模板</button>
      <label class="loop"><input type="checkbox" id="loop" checked>循环</label>
    </div>
  </div>
  <p class="note" id="description">左侧构图与切卡沿用原版；背景柔化后退，右侧保留完整歌词、固定译文位置和低幅频谱。切换“当前模板”可对照同一时刻。</p>
  <audio id="audio" src="../../audio/final.wav" preload="auto"></audio>
</main>
<script type="module" src="preview.js"></script>
</body>
</html>
